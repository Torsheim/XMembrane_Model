}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;heiq-model-explainer&quot;&gt;

    #heiq-model-explainer .core:before,#heiq-model-explainer .core:after{content:&quot;&quot;;position:absolute;left:12px;right:12px;height:1px;background:var(--border)}
    #heiq-model-explainer .core:before{top:55px} #heiq-model-explainer .core:after{bottom:55px}
    #heiq-model-explainer .summaryline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}

  &lt;div class=&quot;top&quot;&gt;
    &lt;h2&gt;HeiQ / XMembrane model&lt;/h2&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;group&quot; aria-label=&quot;Choose figure&quot;&gt;
      &lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot; data-panel=&quot;system&quot;&gt;1 · System&lt;/button&gt;
      &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-panel=&quot;membrane&quot;&gt;2 · Membrane&lt;/button&gt;
      &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-panel=&quot;integration&quot;&gt;3 · Integration&lt;/button&gt;
      &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-panel=&quot;energy&quot;&gt;4 · Energy&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stage&quot;&gt;
    &lt;section class=&quot;panel active&quot; data-id=&quot;system&quot;&gt;
      &lt;div class=&quot;title&quot;&gt;Figure 1 · From weather boundary to electrical power&lt;/div&gt;
      &lt;div class=&quot;subtitle&quot;&gt;The model follows the same air duty through psychrometrics, ERV, active membrane and cooling coil.&lt;/div&gt;
      &lt;div class=&quot;flow&quot;&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Air states&lt;/strong&gt;&lt;span&gt;T, RH, humidity ratio w, enthalpy h, dew point and dry-air flow&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;ERV core&lt;/strong&gt;&lt;span&gt;Prescribed sensible recovery; passive and electrically enhanced moisture transfer&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Local membrane&lt;/strong&gt;&lt;span&gt;Voltage-controlled current; EO drag, diffusion, conductivity and gas films&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Axial sizing&lt;/strong&gt;&lt;span&gt;Eight local segments; area, current and power integrated across the core&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Coil + ledger&lt;/strong&gt;&lt;span&gt;Remaining cooling, condensation, COP, reheat, fans and known active-core power&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;eq&quot;&gt;ṁ&lt;sub&gt;w&lt;/sub&gt; = ṁ&lt;sub&gt;da&lt;/sub&gt;(w&lt;sub&gt;in&lt;/sub&gt; − w&lt;sub&gt;out&lt;/sub&gt;) &amp;nbsp;&amp;nbsp;&amp;nbsp; | &amp;nbsp;&amp;nbsp;&amp;nbsp; Q̇&lt;sub&gt;cool&lt;/sub&gt; = ṁ&lt;sub&gt;da&lt;/sub&gt;(h&lt;sub&gt;in&lt;/sub&gt; − h&lt;sub&gt;off-coil&lt;/sub&gt;)&lt;/div&gt;
      &lt;div class=&quot;streams&quot;&gt;
        &lt;div class=&quot;stream&quot;&gt;&lt;b&gt;Process / outdoor air&lt;/b&gt;&lt;br&gt;32 °C, 80% RH&lt;br&gt;&lt;br&gt;Water and sensible heat leave this stream.&lt;br&gt;&lt;br&gt;&lt;b&gt;Selected outlet:&lt;/b&gt; O30 = 8.886 g/kg&lt;/div&gt;
        &lt;div class=&quot;core&quot;&gt;ACTIVE&lt;br&gt;ERV&lt;br&gt;CORE&lt;/div&gt;
        &lt;div class=&quot;stream&quot;&gt;&lt;b&gt;Return / exhaust air&lt;/b&gt;&lt;br&gt;Receives exactly the water removed from the process stream.&lt;br&gt;&lt;br&gt;Counter-current mass and enthalpy balances are audited.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;summaryline&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;4,365.9 kg/h&lt;/b&gt;&lt;small&gt;Total active-core water transfer&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;1,228.3 kg/h&lt;/b&gt;&lt;small&gt;Increment above passive ERV&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;5,899 m²&lt;/b&gt;&lt;small&gt;Selected O30 active area at 1 V&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;panel&quot; data-id=&quot;membrane&quot;&gt;
      &lt;div class=&quot;title&quot;&gt;Figure 2 · Local membrane problem&lt;/div&gt;
      &lt;div class=&quot;subtitle&quot;&gt;At every axial position, the model solves water flux and current consistently with the imposed terminal voltage.&lt;/div&gt;
      &lt;div class=&quot;membrane&quot;&gt;
        &lt;div class=&quot;bulk&quot;&gt;&lt;b&gt;Process bulk gas&lt;/b&gt;&lt;br&gt;a&lt;sub&gt;s,bulk&lt;/sub&gt;&lt;br&gt;&lt;br&gt;Film relation:&lt;br&gt;N&lt;sub&gt;w&lt;/sub&gt; = K&lt;sub&gt;s&lt;/sub&gt;(a&lt;sub&gt;s,bulk&lt;/sub&gt; − a&lt;sub&gt;s,surf&lt;/sub&gt;)&lt;/div&gt;
        &lt;div class=&quot;slab&quot;&gt;
          &lt;div class=&quot;term&quot;&gt;&lt;span&gt;&lt;b&gt;Electro-osmotic flux&lt;/b&gt;&lt;br&gt;t&lt;sub&gt;w&lt;/sub&gt;j/F&lt;/span&gt;&lt;span class=&quot;plus&quot;&gt;+&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;term&quot;&gt;&lt;span&gt;&lt;b&gt;Diffusive flux&lt;/b&gt;&lt;br&gt;−D(a)S(a) da/dx&lt;/span&gt;&lt;span class=&quot;minus&quot;&gt;±&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;eq&quot;&gt;N&lt;sub&gt;w&lt;/sub&gt; = t&lt;sub&gt;w&lt;/sub&gt;j/F − D(a)S(a) da/dx&lt;/div&gt;
          &lt;div class=&quot;term&quot;&gt;&lt;span&gt;&lt;b&gt;Voltage gradient&lt;/b&gt;&lt;br&gt;j/σ(a) + t&lt;sub&gt;w&lt;/sub&gt;RT/F · d ln(a)/dx&lt;/span&gt;&lt;span&gt;V&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;bulk&quot;&gt;&lt;b&gt;Receiver bulk gas&lt;/b&gt;&lt;br&gt;a&lt;sub&gt;r,bulk&lt;/sub&gt;&lt;br&gt;&lt;br&gt;Film relation:&lt;br&gt;N&lt;sub&gt;w&lt;/sub&gt; = K&lt;sub&gt;r&lt;/sub&gt;(a&lt;sub&gt;r,surf&lt;/sub&gt; − a&lt;sub&gt;r,bulk&lt;/sub&gt;)&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;eq&quot;&gt;V&lt;sub&gt;terminal&lt;/sub&gt; = V&lt;sub&gt;ohmic&lt;/sub&gt; + V&lt;sub&gt;water&lt;/sub&gt; + j·ASR&lt;sub&gt;series&lt;/sub&gt; + V&lt;sub&gt;fixed&lt;/sub&gt;&lt;/div&gt;
      &lt;div class=&quot;summaryline&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;D(a), S(a)&lt;/b&gt;&lt;small&gt;Set passive chemical water permeance&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;t&lt;sub&gt;w&lt;/sub&gt;&lt;/b&gt;&lt;small&gt;Water carried per unit charge; inverse-design input until measured&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;σ(a), L&lt;/b&gt;&lt;small&gt;Set membrane resistance and attainable current&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;panel&quot; data-id=&quot;integration&quot;&gt;
      &lt;div class=&quot;title&quot;&gt;Figure 3 · Local physics becomes full-scale area and power&lt;/div&gt;
      &lt;div class=&quot;subtitle&quot;&gt;Humidity and temperature change along the counter-current core, so the local membrane problem is re-solved segment by segment.&lt;/div&gt;
      &lt;div class=&quot;segments&quot;&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:1&quot;&gt;&lt;b&gt;Segment 1&lt;/b&gt;&lt;span&gt;Local T, a&lt;sub&gt;w&lt;/sub&gt;&lt;br&gt;solve j, N&lt;sub&gt;w&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;A₁, P₁&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:2&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;span&gt;Updated gas states&lt;/span&gt;&lt;span&gt;A₂, P₂&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:3&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;span&gt;Updated films&lt;/span&gt;&lt;span&gt;A₃, P₃&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:4&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;span&gt;Updated σ, D, S&lt;/span&gt;&lt;span&gt;A₄, P₄&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:5&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;span&gt;Updated current&lt;/span&gt;&lt;span&gt;A₅, P₅&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:6&quot;&gt;&lt;b&gt;6&lt;/b&gt;&lt;span&gt;Updated back-diffusion&lt;/span&gt;&lt;span&gt;A₆, P₆&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:7&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;span&gt;Receiver approaches wet end&lt;/span&gt;&lt;span&gt;A₇, P₇&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seg&quot; style=&quot;--i:8&quot;&gt;&lt;b&gt;Segment 8&lt;/b&gt;&lt;span&gt;Target endpoint audit&lt;/span&gt;&lt;span&gt;A₈, P₈&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;integrals&quot;&gt;&lt;div class=&quot;eq&quot;&gt;A&lt;sub&gt;i&lt;/sub&gt; = ṅ&lt;sub&gt;w,i&lt;/sub&gt; / N&lt;sub&gt;w,i&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;eq&quot;&gt;A&lt;sub&gt;total&lt;/sub&gt; = Σ A&lt;sub&gt;i&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;eq&quot;&gt;P&lt;sub&gt;EO&lt;/sub&gt; = Σ(V&lt;sub&gt;i&lt;/sub&gt;j&lt;sub&gt;i&lt;/sub&gt;A&lt;sub&gt;i&lt;/sub&gt;)&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;eq&quot;&gt;Process water loss = receiver water gain &amp;nbsp;&amp;nbsp; → &amp;nbsp;&amp;nbsp; both stream balances must close&lt;/div&gt;
      &lt;div class=&quot;summaryline&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;8 segments&lt;/b&gt;&lt;small&gt;Reduced-order counter-current screen&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;Nonlinear area&lt;/b&gt;&lt;small&gt;Higher voltage can reduce area while raising power&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;Not CFD&lt;/b&gt;&lt;small&gt;Segmented local model, not full conjugate 2D/3D dynamics&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;title&quot;&gt;Figure 4 · Equal-service electrical comparison&lt;/div&gt;

        &lt;div class=&quot;barwrap&quot;&gt;&lt;div class=&quot;bar b3&quot;&gt;&lt;span&gt;418.4&lt;/span&gt;&lt;small&gt;kW&lt;/small&gt;&lt;/div&gt;&lt;label&gt;Active ERV + EO + AC&lt;br&gt;O30, 1 V&lt;/label&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;delta&quot;&gt;&lt;span&gt;Passive ERV effect: &lt;b&gt;622.7 kW&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Incremental EO window: &lt;b&gt;125.3 kW&lt;/b&gt; = 23.05%&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;eq&quot;&gt;P&lt;sub&gt;known&lt;/sub&gt; = P&lt;sub&gt;remaining AC&lt;/sub&gt; + P&lt;sub&gt;EO core&lt;/sub&gt; + P&lt;sub&gt;fans&lt;/sub&gt; + P&lt;sub&gt;included losses&lt;/sub&gt;&lt;/div&gt;
      &lt;div class=&quot;summaryline&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;316.91 kW&lt;/b&gt;&lt;small&gt;Remaining AC power at O30&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;101.49 kW&lt;/b&gt;&lt;small&gt;Other included active-system power&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;125.34 kW&lt;/b&gt;&lt;small&gt;Maximum allowance for omitted loads before advantage disappears&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;heiq-model-explainer&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;button[data-panel]&#x27;)];
      const panels = [...root.querySelectorAll(&#x27;.panel[data-id]&#x27;)];
      buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const id = button.dataset.panel;
        buttons.forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b === button)));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
